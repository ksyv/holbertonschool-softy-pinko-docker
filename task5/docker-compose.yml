services: 
  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    image: softy-pinko-front-end:task4
    ports:
      - "9000"

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    image: softy-pinko-back-end:task4
    ports:
      - "5252"

  proxy:
    build: ./proxy 
    ports:
     - "80:80"
    depends_on:
     - frontend
     - backend
